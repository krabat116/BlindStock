name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry blindstockacr \
            --image blindstock:latest \
            .

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name blindstock \
            --resource-group blindstock-rg \
            --image blindstockacr.azurecr.io/blindstock:latest \
            --revision-suffix $(date +%Y%m%d%H%M%S)
